name: Verify Paylock
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    # Chromium's sandbox needs user namespaces; newer runner AppArmor defaults
    # block the downloaded Playwright binary. Keep the browser sandbox enabled.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Exercise the same env-loading launcher used by the hosted build.
      - run: node scripts/with-env.mjs .env node_modules/next/dist/bin/next build
      - run: npm run test:judge
      - run: npm run test:accounts
